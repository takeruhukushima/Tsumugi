# Tsumugi — main app (Astro SSR on Cloudflare Workers)
name = "tsumugi"
compatibility_date = "2025-08-15"
compatibility_flags = ["nodejs_compat"]

# Astro's cloudflare adapter emits the worker + static assets into ./dist
main = "./dist/_worker.js/index.js"

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "tsumugi"
database_id = "REPLACE_WITH_D1_DATABASE_ID" # `wrangler d1 create tsumugi`
migrations_dir = "migrations"

[vars]
# Public origin of the deployment. Locally use http://127.0.0.1:4321 (astro dev)
# or http://127.0.0.1:8788 (wrangler dev). NOT localhost — atproto loopback
# clients require the 127.0.0.1 loopback IP.
TSUMUGI_ORIGIN = "https://tsumugi.example"
GOOGLE_CLIENT_ID = ""

# Secrets — set with `wrangler secret put <NAME>`, never commit:
#   GOOGLE_CLIENT_SECRET
#   SESSION_SECRET
#   ATP_PRIVATE_JWK
